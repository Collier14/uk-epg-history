
name: Update 7-day historical EPG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore previous EPG archive
        run: |
          if [ -f epg7.xml.gz ]; then
            gzip -dc epg7.xml.gz > epg7.xml
          fi

      - name: Run 7-day EPG archive
        run: python archive7.py

      - name: Compress EPG and remove XML
        run: |
          gzip -c epg7.xml > epg7.xml.gz
          rm epg7.xml

      - name: Commit and push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg7.xml.gz
          git diff --cached --quiet || git commit -m "Update 7-day historical EPG"
        
          git push
