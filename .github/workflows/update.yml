
name: Update historical EPG

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download and merge EPG
        run: |
          python archive.py || {
            echo "First attempt failed. Waiting 1 hour before retry..."
            sleep 3600
            python archive.py
          }

      - name: Compress EPG
        run: gzip -c epg.xml > epg.xml.gz

      - name: Save updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml epg.xml.gz
          git diff --cached --quiet || git commit -m "Update historical EPG"
          git push
